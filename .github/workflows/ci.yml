name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Git hooks are for local commits only.
  HUSKY: 0

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx eslint .

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # SDD 6.6: the whole suite under three timezones. The runner defaults to UTC;
      # TZ is set per run and a guard test fails if a worker ignores it.
      - run: npm run test:tz

  db:
    name: db
    runs-on: ubuntu-latest
    # A hung step should fail, not sit for six hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 2.117.0
      # Supabase's images live on ghcr.io, which rate-limits anonymous pulls
      # hard enough that `supabase start` fails with `toomanyrequests` on a
      # busy afternoon. The runner's own token lifts the limit and costs
      # nothing; it needs no extra secret.
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      # The database, auth and mail: auth.users backs the foreign keys and the
      # sign-in tests read a real emailed code. (`inbucket` is not a container
      # name any more, so excluding it did nothing.)
      #
      # Realtime is excluded here, unlike locally: its image is the one ghcr
      # throttles (`toomanyrequests`, three times in a row, with and without
      # a docker login), and the only test that needs it is already skipped
      # on the runner because postgres_changes never arrive there (P2-F12).
      # Pulling an image for a test that cannot run was buying nothing but a
      # red build.
      - run: >-
          supabase start -x studio,imgproxy,vector,logflare,edge-runtime,storage-api,postgres-meta,supavisor,realtime
      # pgTAP: schema, seq trigger and every RLS cell (SDD 4.3, rule 11).
      - run: supabase test db
      # Two sessions racing on one household's seq (P2-01); pgTAP can't do this.
      - run: supabase/scripts/event-seq-race.sh
      # Email OTP against the real auth server and mail catcher (P2-04).
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: |
          export MORAKI_LOCAL_PUBLISHABLE_KEY=$(supabase status -o env | grep '^PUBLISHABLE_KEY=' | cut -d= -f2- | tr -d '"')
          # Realtime's postgres_changes never arrive on the runner, though the
          # same test passes locally in about half a second (P2-F12). The rest
          # of the real-server tests do run here.
          npm run test:local -- --testPathIgnorePatterns 'realtime\.local'

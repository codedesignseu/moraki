<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=390">
<meta charset="utf-8">
<title>Feedback · day</title>
</head>
<body>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@600;700&amp;family=Manrope:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F3F2EE; color: #161412; font-family: 'Manrope', -apple-system, system-ui, sans-serif; font-variant-numeric: tabular-nums">
<div style="padding: 56px 18px 180px; display: flex; flex-direction: column; gap: 16px"><div style="display: flex; justify-content: space-between; align-items: center; gap: 10px"><div style="display: flex; justify-content: flex-start; align-items: center; gap: 12px"><button aria-label="Back" style="width: 48px; height: 48px; flex-shrink: 0; border: none; border-radius: 50%; background: #FFFFFF; color: #161412; font: inherit; font-size: 24px; font-weight: 500; line-height: 1; display: flex; align-items: center; justify-content: center">×</button><h1 style="margin: 0; font-family: 'Comfortaa', 'Manrope', sans-serif; font-size: 22px; font-weight: 700">Feedback</h1></div></div><div style="background: #FFFFFF; border-radius: 26px; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px;"><div style="font-size: 13px; font-weight: 600; color: #5C5852; padding: 0 2px">Kind</div><div role="radiogroup" aria-label="Kind" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 5px; border-radius: 30px; background: #F3F2EE"><button role="radio" aria-checked="false" style="min-height: 48px; padding: 0 8px; border: none; border-radius: 24px; background: transparent; color: #161412; font: inherit; font-size: 15px; font-weight: 600">Idea</button><button role="radio" aria-checked="true" style="min-height: 48px; padding: 0 8px; border: none; border-radius: 24px; background: #161412; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 800">Problem</button><button role="radio" aria-checked="false" style="min-height: 48px; padding: 0 8px; border: none; border-radius: 24px; background: transparent; color: #161412; font: inherit; font-size: 15px; font-weight: 600">Other</button></div><label style="display: flex; flex-direction: column; gap: 6px"><div style="font-size: 13px; font-weight: 600; color: #5C5852; padding: 0 2px">Message</div><div style="min-height: 170px; border: 1.5px solid #7C7973; border-radius: 16px; background: transparent; padding: 0 14px; box-sizing: border-box; display: flex; align-items: flex-start; padding-top: 14px; gap: 10px"><span style="flex: 1; font-size: 17px; font-weight: 500; color: #5C5852; line-height: 1.4">Tell us what happened, in your own words.</span></div></label></div><div style="font-size: 15px; font-weight: 500; line-height: 1.35; color: #5C5852;">We read every message. No data from your log is sent with it.</div></div><div style="position: absolute; left: 18px; right: 18px; bottom: 34px; display: flex; flex-direction: column; gap: 6px"><button style="width: 100%; height: 60px; border: none; border-radius: 30px; background: #161412; color: #FFFFFF; font: inherit; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center">Send</button><button style="min-height: 48px; border: none; background: transparent; color: #161412; font: inherit; font-size: 16px; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; display: flex; align-items: center; justify-content: center; padding: 0">Not now</button></div>
</div>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Moraki · Baby details · night</title>
<!-- Moraki screen 03-baby-details · Baby details · night mode · palette tokens: guidelines/tokens -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@600&family=Ysabeau+Infant:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;background:#131814}
*{-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}

</style>
</head>
<body>
<div id="screen" style="width:390px;height:844px;overflow:hidden;position:relative">


<div style="width: 390px; height: 844px; box-sizing: border-box; background: #131814; color: #E6ECE4; font-family: 'Ysabeau Infant', sans-serif; padding: 56px 18px 34px; display: flex; flex-direction: column; gap: 14px">
<a href="SgHousehold.dc.html" aria-label="Back" style="width: 48px; height: 48px; border-radius: 50%; background: #1E2520; color: #E6ECE4; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 26px">‹</a>
<h1 style="margin: 0; font-size: 34px; font-weight: 800; line-height: 1.1">Tell us about your little one</h1>
<div style="font-size: 17px; font-weight: 600; color: #A9B5AB">Three things. You can change them later.</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="sg-name" style="font-size: 15px; font-weight: 700; color: #A9B5AB; padding-left: 6px">Her name</label>
<input id="sg-name" type="text" value="Elena" style="height: 60px; border: none; border-radius: 30px; background: #1E2520; color: #E6ECE4; padding: 0 22px; font: inherit; font-size: 22px; font-weight: 800; box-shadow: inset 0 0 0 2px #E6ECE4">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="sg-born" style="font-size: 15px; font-weight: 700; color: #A9B5AB; padding-left: 6px">Born on</label>
<input id="sg-born" type="text" value="24 September 2026" style="height: 60px; border: none; border-radius: 30px; background: #1E2520; color: #E6ECE4; padding: 0 22px; font: inherit; font-size: 20px; font-weight: 700">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="sg-weight" style="font-size: 15px; font-weight: 700; color: #A9B5AB; padding-left: 6px">Birth weight</label>
<div style="display: flex; gap: 8px">
<input id="sg-weight" type="text" value="3.20" style="flex: 1; min-width: 0; height: 60px; border: none; border-radius: 30px; background: #1E2520; color: #E6ECE4; padding: 0 22px; font: inherit; font-size: 20px; font-weight: 700">
<div style="display: flex; gap: 4px; padding: 5px; border-radius: 30px; background: #1E2520"><button aria-pressed="true" style="width: 56px; height: 50px; border: none; border-radius: 25px; background: #CFE0D3; color: #131814; font: inherit; font-size: 16px; font-weight: 800">kg</button><button style="width: 56px; height: 50px; border: none; border-radius: 25px; background: transparent; color: #E6ECE4; font: inherit; font-size: 16px; font-weight: 700">lb</button></div>
</div>
</div>
<div style="border-radius: 26px; background: #353A28; color: #E6ECE4; padding: 16px 18px; font-size: 17px; font-weight: 700; line-height: 1.4">Elena is <b>12 days old</b> today. Welcome to the world, little one.</div>
<div style="flex: 1"></div>
<a href="SgHomeEmpty.dc.html" style="height: 60px; border-radius: 30px; background: #CFE0D3; color: #131814; text-decoration: none; font-size: 18px; font-weight: 800; display: flex; align-items: center; justify-content: center">Save and go home</a>
</div>

</div>
</body>
</html>
